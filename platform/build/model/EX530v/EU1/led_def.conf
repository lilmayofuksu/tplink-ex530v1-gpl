#loops_per_sec: poll interval
loops_per_sec=8
#
#id:    entry id, will turn at most 4 bytes string to unsigned int id
#gpio:  gpio number
#mode:  available values below
#       0. not enabled, could be enabled by proc
#       1. on off(reve needed, speed is needed if support to change to blink mode)
#       2. blink(speed & reve needed)
#       3. slow blink(speed & reve needed)
#       4. pulse(speed & reve & priv needed, priv used as pulse width)
#       5. once(speed & reve & priv needed, priv used as stored count theshold)
#       6. netdev(speed & reve & priv needed, priv used as netdev ifname, NULL not permitted)
#       7. usbdev(speed & reve & priv needed, priv used as usbdev ifname, NULL means all USB dev)
#       8. netdev_list(speed & reve & priv needed, priv used as netdev ifname list, this type is one and only)
#speed: poll loops each turn(1 means fastest, 2 means wait 2 poll loops each turn)
#reve(reverse): on/off reverse (draw high to light LED means gpio reversed)
#priv:  private data, depends on type
#
#here are some examples
##id   gpio  mode  speed reve  priv
#TEST  0     0     1     0     0   (gpio 0 not used currently, same as on/off LED always off)
#SYS   1     1     1     0     0   (gpio 1 used as an on/off LED, and on/off could be edit by proc)
#DSL   2     2     1     0     0   (gpio 2 used as an always blink LED, write proc to stop blink)
#PULS  3     3     1     0     0   (gpio 3 used as an pulse LED, similar as blink LED)
#DATA  4     4     1     0     0   (gpio 4 used as an blink once LED, could add blink times by proc)
#LAN1  5     5     1     0     "eth1" (gpio 5 used as an netdev LED, if eth1 acts, LED blinks)
#USB1  6     6     1     0     "usb1"  (gpio 6 used as an usbdev LED, if usbdev at usb bus "usb1"(could get name from /sys/bus/usb/devices/ number named dev with no ':') acts, LED blinks)
#USB   6     6     1     0     NULL   (gpio 6 used as an usbdev LED, if any usbdev acts, LED blinks)
#ETH   7     7     1     0     {"eth1","eth2","eth3","eth4"}
#                        (gpio 7 used as an netdev_list LEd, if any netdev in list acts, LED blinks)
#
#id   gpio  mode  speed reve  priv
POWR  11    3     1     1     0
INE2  10    0     1     1     0
LAN    3    1     1     0     0
INET   1    1     1     1     0
WIFI   6    1     1     1     0
FXS1   5    1     1     0     0
USB	   4    1     1     0     0
